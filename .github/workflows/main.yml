
name: Build Living World Gaming Toolkit APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Gaming Toolkit project
        run: |
          set -eu
          ZIP="./LivingWorld_Gaming_Toolkit_v2_0_0.zip"
          test -f "$ZIP" || {
            echo "Gaming Toolkit ZIP not found: $ZIP"
            exit 1
          }
          mkdir -p extracted
          unzip -o "$ZIP" -d extracted
          PROJECT_FILE=$(find extracted -type f -name settings.gradle.kts -print -quit)
          test -n "$PROJECT_FILE" || {
            echo "Gradle project not found in ZIP"
            exit 1
          }
          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Generate Gradle wrapper
        run: gradle -p "$PROJECT_DIR" wrapper --gradle-version 8.9

      - name: Build Gaming Toolkit APK
        run: |
          chmod +x "$PROJECT_DIR/gradlew"
          "$PROJECT_DIR/gradlew" -p "$PROJECT_DIR" --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LivingWorld-Gaming-Toolkit-v2.0.0
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
